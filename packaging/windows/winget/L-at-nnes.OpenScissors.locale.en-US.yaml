ShortDescription: Offline background remover
Description: >-
  OpenScissors cuts out the subject of a photo with an AI model that runs on your computer, then lets you correct the
  mask with a brush, change the background, add a shadow, crop and export. A whole folder can be processed at once,
  and a command line tool does the same from a script. Nothing is sent anywhere.
