name: ci
on:
  push:
  pull_request:
  schedule:
    # New advisories appear without any commit: look again every Monday.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace   # the tests that need a model are ignored here and run by the `models` job
      - run: node --test scripts/update-manifests.test.mjs   # the script that fills in the package manifests at a release
      # The window itself, on a virtual display: the selftest opens a picture that is already cut out (no model needed),
      # changes the background and saves snapshots of the real interface. It reuses what `cargo test` just built.
      - name: Window smoke test (Linux, virtual display)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb libxkbcommon-x11-0
          export OPENSCISSORS_HOME="$RUNNER_TEMP/osc-home"
          xvfb-run -a -s "-screen 0 1400x900x24" timeout 240             cargo run -p openscissors --example selftest -- tests/data/synthetic_cutout.png "$RUNNER_TEMP/smoke" script tests/smoke.json
          for shot in 02-opened smoke-gradient smoke-compare; do
            size=$(stat -c %s "$RUNNER_TEMP/smoke/$shot.png")
            echo "$shot.png: $size bytes"
            test "$size" -gt 20000
          done
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: window-smoke-test
          path: ${{ runner.temp }}/smoke/*.png
          if-no-files-found: ignore

  # The tests that need real models (golden mask, end-to-end pipeline, SAM 2), with the models downloaded by the command
  # line itself (pinned SHA-256) and kept in the cache between runs. A regression in the pipeline shows up here.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/osc-models-home/models
          key: models-isnet-sam2tiny-${{ hashFiles('crates/core/src/model/registry.rs') }}
          restore-keys: models-isnet-sam2tiny-
      - name: Download the models (checked against their SHA-256, resumed if the cache holds a part)
        run: |
          export OPENSCISSORS_HOME="$RUNNER_TEMP/osc-models-home"
          cargo run --release -p openscissors-cli -- models download isnet-general-use
          cargo run --release -p openscissors-cli -- models download sam2-tiny
      - name: Tests with the models
        run: |
          export OPENSCISSORS_MODEL="$RUNNER_TEMP/osc-models-home/models/isnet-general-use/model.onnx"
          export OPENSCISSORS_SAM_DIR="$RUNNER_TEMP/osc-models-home/models/sam2-tiny"
          cargo test --release -p openscissors-core --test golden --test pipeline --test sam2 -- --include-ignored --nocapture

  # The oldest Rust the workspace says it supports (`rust-version` in Cargo.toml) must still build it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - run: cargo check --workspace --all-targets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check   # deny.toml: advisories, bans, licences, sources

  portable:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p openscissors -p openscissors-cli
      - run: node scripts/package-portable.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: openscissors-windows-portable
          path: dist/OpenScissors/**/*

  fuzz:
    # The readers of outside files (pictures, projects, marks, settings) get random input for a few minutes each,
    # every week and on demand. An input that crashes one is kept as an artifact (see CONTRIBUTING.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for two minutes
        run: |
          for target in decode_image load_project marks settings; do
            cargo fuzz run "$target" -- -max_total_time=120 -rss_limit_mb=4096 -max_len=1048576
          done
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
