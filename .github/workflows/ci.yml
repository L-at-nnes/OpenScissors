name: ci
on:
  push:
  pull_request:
  schedule:
    # New advisories appear without any commit: look again every Monday.
    - cron: "0 6 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace   # golden and pipeline tests are skipped without OPENSCISSORS_MODEL
      # The window itself, on a virtual display: the selftest opens a picture that is already cut out (no model needed),
      # changes the background and saves snapshots of the real interface. It reuses what `cargo test` just built.
      - name: Window smoke test (Linux, virtual display)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb libxkbcommon-x11-0
          export OPENSCISSORS_HOME="$RUNNER_TEMP/osc-home"
          xvfb-run -a -s "-screen 0 1400x900x24" timeout 240             cargo run -p openscissors --example selftest -- tests/data/synthetic_cutout.png "$RUNNER_TEMP/smoke" script tests/smoke.json
          for shot in 02-opened smoke-gradient smoke-compare; do
            size=$(stat -c %s "$RUNNER_TEMP/smoke/$shot.png")
            echo "$shot.png: $size bytes"
            test "$size" -gt 20000
          done
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: window-smoke-test
          path: ${{ runner.temp }}/smoke/*.png
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources   # deny.toml

  portable:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p openscissors -p openscissors-cli
      - run: node scripts/package-portable.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: openscissors-windows-portable
          path: dist/OpenScissors/**/*
