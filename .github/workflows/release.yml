name: release

# Push a tag such as v1.1.0 (it must match the version in Cargo.toml) and this workflow builds the portable
# archives on each system and publishes them as a GitHub release. "Run workflow" builds the archives only.
# A tag without the "v" (1.1.0) is treated the same way, so that no tag can skip the version check below.
on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
          # No macOS Intel build: ONNX Runtime ships no prebuilt binary for x86_64-apple-darwin.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev zip xvfb libxkbcommon-x11-0
      - run: cargo test --workspace --release
      - run: node scripts/package-portable.mjs --build --zip
      # Unzip the archive somewhere else and run it: a zip that builds but does not start is not published.
      - run: node scripts/check-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: openscissors-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openscissors-*
          merge-multiple: true
          path: out
      - name: Checksums
        working-directory: out
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" --title "OpenScissors ${GITHUB_REF_NAME#v}" --generate-notes $flags

  # The Scoop and winget manifests of packaging/windows always describe the latest release: once it is published, its
  # version, address and SHA-256 are written into them and committed to main. A pre-release (v1.2.3-rc1) is left alone.
  manifests:
    needs: publish
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: The checksums of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
      - run: node scripts/update-manifests.mjs "${GITHUB_REF_NAME#v}" SHA256SUMS.txt
      - name: Commit to main
        run: |
          rm SHA256SUMS.txt
          if git diff --quiet; then echo "The manifests already describe this release."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(dist): update the scoop and winget manifests for ${GITHUB_REF_NAME#v}"
          # Someone may have pushed to main since the checkout: take their commits first (the files are not theirs).
          git pull --rebase origin main
          git push origin HEAD:main
