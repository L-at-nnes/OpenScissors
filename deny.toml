# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/). CI runs `cargo deny check`: known
# vulnerabilities, wildcard versions, crates that do not come from crates.io, and the licences of every dependency.

[advisories]
version = 2
yanked = "deny"
# Only the crates the workspace itself depends on: Slint pulls in unmaintained ones (ttf-parser, zbus) that nothing can fix here.
unmaintained = "workspace"

[licenses]
version = 2
# Permissive licences only. Slint is offered as GPL-3.0 OR its Royalty-free License 2.0 OR a commercial licence: the
# Royalty-free one is the one used (see THIRD_PARTY.md), so GPL-3.0 itself is not on the list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "NCSA",
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# `path = "../core"` between our own crates is not a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
