[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
publish = false

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.openscissors-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
