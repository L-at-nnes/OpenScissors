[package]
name = "openscissors-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# Writes the JPEG XL pictures the tests read back (the application only reads them).
zune-jpegxl = "0.4"
zune-core = "0.4"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "avif"] }
fast_image_resize = { version = "5", features = ["rayon"] }
rayon = "1"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
moxcms = "0.8"
ureq = { version = "3", features = ["rustls"] }
webp = { version = "0.3", default-features = false }
# The TIFF encoder of `image` writes no compression and no resolution: the `tiff` crate it uses does both.
tiff = { version = "0.11", default-features = false, features = ["deflate"] }
# JPEG XL pictures, read through the decoding hooks of `image` (pure Rust).
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }

[features]
# NVIDIA graphics cards through CUDA, tried before DirectML (Windows) or alone (Linux). It downloads the CUDA build of
# ONNX Runtime and needs the CUDA 12 runtime and cuDNN 9 on the machine that runs it (see README, GPU).
cuda = ["ort/cuda"]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "coreml"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "directml"] }

