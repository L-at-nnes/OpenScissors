[package]
name = "openscissors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Open source semi-automatic background removal"
build = "build.rs"

[features]
default = ["software"]
software = ["slint/renderer-software", "slint/software-renderer-systemfonts"]
gl = ["slint/renderer-femtovg"]

[dependencies]
openscissors-core = { path = "../core" }
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "compat-1-2", "accessibility", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
sys-locale = "0.3"

[build-dependencies]
slint-build = "1.18"
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "openscissors"
path = "src/main.rs"
