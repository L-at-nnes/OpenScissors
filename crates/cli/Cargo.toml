[package]
name = "openscissors-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "openscissors-cli"
path = "src/main.rs"

[features]
# NVIDIA graphics cards through CUDA (see the `cuda` feature of openscissors-core).
cuda = ["openscissors-core/cuda"]

[dependencies]
openscissors-core = { path = "../core" }
serde_json = "1"
